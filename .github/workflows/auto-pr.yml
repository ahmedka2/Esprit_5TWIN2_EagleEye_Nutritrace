name: Auto PR
on:
  push:
    branches-ignore: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --json number -q 'length')
          if [ "$existing" = "0" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "$BRANCH" --body "Auto-created from a push by @$GITHUB_ACTOR"
          else
            echo "PR already exists for $BRANCH"
          fi
